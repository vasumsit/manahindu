  var cur = 0;
  var box, img, cap, counter;
  function ready(){ box=document.getElementById('mh-lightbox'); img=document.getElementById('mh-lb-img'); cap=document.getElementById('mh-lb-caption'); counter=document.getElementById('mh-lb-counter'); }
  function show(){ if(!box) ready(); var it=imgs[cur]; img.src=it.src; img.alt=it.alt; cap.textContent=it.alt; counter.textContent=(cur+1)+' / '+imgs.length; }
  return {
    open:function(i){ if(!box) ready(); cur=i; show(); box.classList.add('open'); document.body.style.overflow='hidden'; },
    close:function(){ if(box){ box.classList.remove('open'); document.body.style.overflow=''; } },
    next:function(e){ if(e) e.stopPropagation(); cur=(cur+1)%imgs.length; show(); },
    prev:function(e){ if(e) e.stopPropagation(); cur=(cur-1+imgs.length)%imgs.length; show(); },
    bgClose:function(e){ if(e.target && e.target.id==='mh-lightbox') this.close(); }
  };
})();
document.addEventListener('keydown', function(e){
  var box=document.getElementById('mh-lightbox');
  if(!box || !box.classList.contains('open')) return;
  if(e.key==='ArrowRight') mhLightbox.next();
  else if(e.key==='ArrowLeft') mhLightbox.prev();
  else if(e.key==='Escape') mhLightbox.close();
});
