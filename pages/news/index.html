<title>వార్తలు — మన హిందూ ManaHindu | Devotional News</title>
<meta name="description" content="మన హిందూ వార్తలు — దేవాలయ వార్తలు, పండుగ ప్రకటనలు, ఆధ్యాత్మిక సమాచారం తెలుగులో."/>

<style>
  .news-item{background:linear-gradient(135deg,#fff,#fdf6e8);border:1px solid #ecd9a8;border-radius:16px;
    overflow:hidden;margin-bottom:1.5rem;box-shadow:0 4px 16px rgba(124,28,28,0.08);}
  .news-item img{width:100%;max-height:340px;object-fit:cover;display:block;}
  .news-body{padding:1.2rem 1.4rem;}
  .news-title{font-family:'Tiro Telugu',serif;font-size:1.35rem;color:#3a0f14;margin-bottom:0.4rem;}
  .news-date{font-size:0.75rem;color:#a8862a;margin-bottom:0.7rem;letter-spacing:0.03em;}
  .news-text{font-family:'Tiro Telugu',serif;line-height:1.9;color:#2a2320;white-space:pre-wrap;}
  .news-empty{text-align:center;color:#8a7a5a;padding:3rem 1rem;font-family:'Tiro Telugu',serif;}
</style>
</head>
<body>
<div id="site-header"></div>
<div id="mh-hero"></div>
<script>window.MHPage={"title": "📰 వార్తలు", "sub": "దేవాలయ వార్తలు · పండుగ ప్రకటనలు · ఆధ్యాత్మిక సమాచారం", "breadcrumb": [{"label": "హోమ్", "href": "../../index.html"}, {"label": "వార్తలు", "href": "../../pages/news/index.html"}]};</script>
<section class="section"><div class="container" style="max-width:760px;">
<div id="newsContainer"><div class="news-empty">⏳ వార్తలు లోడ్ అవుతున్నాయి...</div></div>
</div></section>
<div id="site-footer"></div>
<script src="../../assets/js/main.js?v=20260712b"></script>
<script src="../../assets/js/site-chrome.js?v=20260712b"></script>
<script>
(function(){
  var SHEET_API="https://script.google.com/macros/s/AKfycbzN4ltI-0Mg6n6YYrCIIsO5lTzXpCxQ2tg4fMCWMgnIVrDnGodNBhw7EXxHBU3rEwk/exec";
  var el=document.getElementById('newsContainer');
  if(SHEET_API.indexOf('PASTE')!==-1){ el.innerHTML='<div class="news-empty">🙏 వార్తలు త్వరలో అందుబాటులోకి వస్తాయి.</div>'; return; }
  fetch(SHEET_API)
    .then(function(r){return r.json();})
    .then(function(j){
      var news=(j&&j.news)?j.news:[];
      if(!news.length){ el.innerHTML='<div class="news-empty">🙏 ప్రస్తుతం వార్తలు లేవు. త్వరలో అప్‌డేట్ అవుతాయి.</div>'; return; }
      el.innerHTML='';
      news.forEach(function(n){
        var d=new Date(n.date).toLocaleDateString('te-IN',{year:'numeric',month:'long',day:'numeric'});
        var img='';
        var body=(n.body||'').replace(/</g,'&lt;');
        el.innerHTML+='<div class="news-item">'+img+'<div class="news-body"><div class="news-title">'+
          (n.title||'').replace(/</g,'&lt;')+'</div><div class="news-date">📅 '+d+'</div><div class="news-text">'+body+'</div></div></div>';
      });
    })
    .catch(function(){ el.innerHTML='<div class="news-empty">వార్తలు లోడ్ చేయడంలో లోపం.</div>'; });
})();
</script>
</body>
</html>
