<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>News Admin — ManaHindu</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Telugu&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{--ink:#0d0b12;--ink2:#1c1826;--gold:#d4af37;--gold-soft:#e8cf8a;--maroon:#3a0f14;--ivory:#f4ecdd;--muted:#a89f8e;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--ivory);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;padding:20px 16px 60px;}
  .tel{font-family:'Tiro Telugu',serif;}
  .wrap{max-width:480px;margin:0 auto;}
  h1{font-family:'Tiro Telugu',serif;font-size:1.6rem;color:var(--gold-soft);text-align:center;margin-bottom:4px;font-weight:400;}
  .sub{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:24px;}
  .om{text-align:center;font-size:2.4rem;color:var(--gold);margin-bottom:8px;}

  /* Login gate */
  .gate{background:var(--ink2);border:1px solid rgba(212,175,55,0.2);border-radius:16px;padding:28px 22px;margin-top:20px;}
  .card{background:var(--ink2);border:1px solid rgba(212,175,55,0.2);border-radius:16px;padding:22px 18px;margin-bottom:18px;}
  label{display:block;font-size:0.85rem;color:var(--gold-soft);margin:14px 0 6px;font-weight:400;}
  input[type=text],input[type=password],textarea,input[type=file]{
    width:100%;background:#0a0810;border:1px solid rgba(212,175,55,0.25);border-radius:10px;
    padding:12px 14px;color:var(--ivory);font-family:inherit;font-size:1rem;}
  textarea{min-height:120px;resize:vertical;line-height:1.7;font-family:'Tiro Telugu',serif;}
  input:focus,textarea:focus{outline:none;border-color:var(--gold);}
  .btn{width:100%;padding:14px;border:none;border-radius:50px;font-family:inherit;font-size:1rem;font-weight:500;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--ink);cursor:pointer;margin-top:20px;
    transition:transform .2s;}
  .btn:active{transform:scale(0.98);}
  .btn.sec{background:transparent;border:1px solid var(--gold);color:var(--gold-soft);}
  .msg{padding:12px 14px;border-radius:10px;margin-top:14px;font-size:0.9rem;text-align:center;display:none;}
  .msg.ok{background:rgba(76,175,80,0.15);color:#a5d6a7;border:1px solid rgba(76,175,80,0.3);display:block;}
  .msg.err{background:rgba(244,67,54,0.15);color:#ef9a9a;border:1px solid rgba(244,67,54,0.3);display:block;}
  .msg.info{background:rgba(212,175,55,0.12);color:var(--gold-soft);border:1px solid rgba(212,175,55,0.3);display:block;}
  .preview{margin-top:12px;border-radius:10px;overflow:hidden;display:none;}
  .preview img{width:100%;display:block;}
  .hidden{display:none;}
  .setup-note{background:rgba(212,175,55,0.08);border:1px dashed rgba(212,175,55,0.35);border-radius:10px;padding:12px;font-size:0.8rem;color:var(--muted);margin-top:14px;line-height:1.6;}
  .item{background:#0a0810;border:1px solid rgba(212,175,55,0.15);border-radius:12px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:flex-start;}
  .item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .item .t{font-family:'Tiro Telugu',serif;font-size:0.9rem;color:var(--ivory);}
  .item .d{font-size:0.7rem;color:var(--muted);margin-top:2px;}
  .item .del{margin-left:auto;color:#ef9a9a;background:none;border:none;font-size:1.2rem;cursor:pointer;flex-shrink:0;}
  a.back{display:block;text-align:center;color:var(--gold-soft);margin-top:20px;font-size:0.85rem;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="om">ॐ</div>
  <h1 class="tel">వార్తల నిర్వహణ</h1>
  <div class="sub">News Admin · ManaHindu</div>

  <!-- LOGIN GATE -->
  <div id="gate" class="gate">
    <label class="tel">పాస్‌వర్డ్ (Password)</label>
    <input type="password" id="pw" placeholder="Enter password"/>
    <button class="btn" onclick="login()">ప్రవేశించండి · Login</button>
    <div id="gateMsg" class="msg"></div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="panel" class="hidden">
    <div class="card">
      <label class="tel">📰 శీర్షిక (Headline)</label>
      <input type="text" id="title" placeholder="వార్త శీర్షిక..."/>

      <label class="tel">📝 వివరాలు (Details)</label>
      <textarea id="body" class="tel" placeholder="వార్త వివరాలు ఇక్కడ రాయండి..."></textarea>

      <label class="tel">📷 ఫోటో (మీ ఫోన్ నుండి ఎంచుకోండి)</label>
      <input type="file" id="photo" accept="image/*"/>
      <div id="preview" class="preview"><img id="previewImg" src="" alt=""/></div>

      <div id="setupNote" class="setup-note">
        ⚙️ <b>ఒకసారి సెటప్:</b> Google Sheet web app URL ని <code>SHEET_API</code> దగ్గర పెట్టండి. ఫోటో కోసం ImgBB key (ఐచ్ఛికం) — లేకపోతే ఫోటో URL పేస్ట్ చేయవచ్చు.
      </div>

      <button class="btn" onclick="publish()">🚀 ప్రచురించండి · Publish</button>
      <div id="pubMsg" class="msg"></div>
    </div>

    <div class="card">
      <label class="tel" style="margin-top:0;">🗂️ ప్రస్తుత వార్తలు (Current News)</label>
      <div id="newsList"></div>
    </div>

    <button class="btn sec" onclick="logout()">లాగ్ అవుట్ · Logout</button>
  </div>

  <a class="back tel" href="../index.html">← వెబ్‌సైట్‌కి తిరిగి</a>
</div>

<script>
/* ========= CONFIG ========= */
var ADMIN_PASSWORD = "vasu@manahindu";   // your login password (must match SECRET in Apps Script)
var SHEET_API = "PASTE_YOUR_GOOGLE_SHEET_WEBAPP_URL_HERE";  // paste your Apps Script web app URL
var IMGBB_KEY = "PASTE_YOUR_IMGBB_KEY_HERE";  // optional: for photo file upload
/* ========================== */

function login(){
  var pw=document.getElementById('pw').value;
  var m=document.getElementById('gateMsg');
  if(pw===ADMIN_PASSWORD){
    sessionStorage.setItem('mh_admin','1');
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    if(IMGBB_KEY && IMGBB_KEY.indexOf('PASTE')===-1) document.getElementById('setupNote').style.display='none';
    loadNews();
  } else { m.className='msg err'; m.textContent='తప్పు పాస్‌వర్డ్ · Wrong password'; }
}
function logout(){ sessionStorage.removeItem('mh_admin'); location.reload(); }
if(sessionStorage.getItem('mh_admin')==='1'){ window.addEventListener('DOMContentLoaded',function(){document.getElementById('gate').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');if(IMGBB_KEY&&IMGBB_KEY.indexOf('PASTE')===-1)document.getElementById('setupNote').style.display='none';loadNews();}); }

/* image preview */
document.addEventListener('change',function(e){
  if(e.target && e.target.id==='photo'){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(ev){ document.getElementById('previewImg').src=ev.target.result; document.getElementById('preview').style.display='block'; };
    r.readAsDataURL(f);
  }
});

function uploadImage(){
  return new Promise(function(resolve){
    var f=document.getElementById('photo').files[0];
    if(!f){ resolve(''); return; }
    if(!IMGBB_KEY || IMGBB_KEY.indexOf('PASTE')!==-1){ resolve(''); return; }
    var fd=new FormData(); fd.append('image', f);
    fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd})
      .then(function(r){return r.json();})
      .then(function(j){ resolve((j&&j.data&&j.data.url)?j.data.url:''); })
      .catch(function(){ resolve(''); });
  });
}

function getNews(){
  return fetch(SHEET_API)
    .then(function(r){return r.json();})
    .then(function(j){ return (j&&j.news)?j.news:[]; })
    .catch(function(){ return []; });
}
function postToSheet(payload){
  payload.secret = ADMIN_PASSWORD;
  return fetch(SHEET_API, {
    method:'POST',
    body:JSON.stringify(payload)
  }).then(function(r){return r.json();});
}

function publish(){
  var title=document.getElementById('title').value.trim();
  var body=document.getElementById('body').value.trim();
  var m=document.getElementById('pubMsg');
  if(!title){ m.className='msg err'; m.textContent='శీర్షిక అవసరం · Headline required'; return; }
  m.className='msg info'; m.textContent='⏳ ప్రచురిస్తోంది... Publishing...';
  uploadImage().then(function(imgUrl){
    return postToSheet({ title:title, body:body, img:imgUrl, date:new Date().toISOString() });
  }).then(function(){
    m.className='msg ok'; m.textContent='✅ ప్రచురించబడింది! Published!';
    document.getElementById('title').value=''; document.getElementById('body').value='';
    document.getElementById('photo').value=''; document.getElementById('preview').style.display='none';
    loadNews();
  }).catch(function(){ m.className='msg err'; m.textContent='❌ లోపం. మళ్ళీ ప్రయత్నించండి.'; });
}

function loadNews(){
  var el=document.getElementById('newsList');
  el.innerHTML='<div style="color:#a89f8e;font-size:0.85rem;">Loading...</div>';
  getNews().then(function(arr){
    if(!arr.length){ el.innerHTML='<div style="color:#a89f8e;font-size:0.85rem;">వార్తలు లేవు · No news yet</div>'; return; }
    el.innerHTML='';
    arr.forEach(function(n){
      var d=new Date(n.date).toLocaleDateString('te-IN');
      var img=n.img?'<img src="'+n.img+'" alt="">':'';
      el.innerHTML+='<div class="item">'+img+'<div><div class="t">'+n.title+'</div><div class="d">'+d+'</div></div><button class="del" onclick="delNews(\''+n.date+'\',\''+(n.title||'').replace(/'/g,"")+'\')">×</button></div>';
    });
  });
}
function delNews(date, title){
  if(!confirm('ఈ వార్తను తొలగించాలా? Delete this news?')) return;
  postToSheet({ action:'delete', date:date, title:title }).then(loadNews);
}
</script>
</body>
</html>
